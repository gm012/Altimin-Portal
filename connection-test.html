<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Altimin Portal Connection Test
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0d10;
            color: #f3f5f7;
            font-family:
                Inter,
                Arial,
                sans-serif;
        }

        main {
            width: min(
                900px,
                calc(100% - 40px)
            );
            margin: 0 auto;
            padding: 70px 0;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        .lead {
            margin: 0 0 32px;
            color: #9da6b2;
            line-height: 1.6;
        }

        .status {
            margin-bottom: 24px;
            padding: 18px 20px;
            border: 1px solid #303640;
            border-radius: 12px;
            background: #14171c;
        }

        .status.testing {
            border-color: #80731e;
        }

        .status.success {
            border-color: #26864e;
        }

        .status.error {
            border-color: #a83b3b;
        }

        #signInHost {
            max-width: 460px;
            margin: 30px 0;
        }

        pre {
            overflow: auto;
            min-height: 120px;
            padding: 20px;
            border: 1px solid #303640;
            border-radius: 12px;
            background: #111419;
            color: #b9f6ca;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        button {
            margin-top: 16px;
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        [hidden] {
            display: none !important;
        }

    </style>

</head>


<body>

    <main>

        <h1>
            Altimin Portal Connection Test
        </h1>

        <p class="lead">
            Clerk authentication → Supabase →
            Altimin database → Row Level Security.
        </p>


        <div
            id="status"
            class="status testing"
        >
            Starting connection test...
        </div>


        <div id="signInHost"></div>


        <pre id="output">
Waiting for Clerk...
        </pre>


        <button
            id="retryButton"
            type="button"
            hidden
        >
            Run test again
        </button>

    </main>


    <!-- =====================================================
         PUBLIC CONFIG
    ====================================================== -->

    <script src="portal-config.js"></script>


    <!-- =====================================================
         SUPABASE JAVASCRIPT CLIENT
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         CONNECTION TEST
    ====================================================== -->

    <script>

        (() => {

            "use strict";


            const config =
                window.AltiminConfig;


            const statusElement =
                document.getElementById(
                    "status"
                );


            const outputElement =
                document.getElementById(
                    "output"
                );


            const signInHost =
                document.getElementById(
                    "signInHost"
                );


            const retryButton =
                document.getElementById(
                    "retryButton"
                );


            let databaseClient = null;

            let testRunning = false;


            // =================================================
            // STATUS
            // =================================================

            function setStatus(
                message,
                type = "testing"
            ) {

                statusElement.textContent =
                    message;

                statusElement.className =
                    `status ${type}`;

            }


            function setOutput(
                value
            ) {

                if (
                    typeof value ===
                    "string"
                ) {

                    outputElement.textContent =
                        value;

                    return;

                }


                outputElement.textContent =
                    JSON.stringify(
                        value,
                        null,
                        2
                    );

            }


            // =================================================
            // CONFIG VALIDATION
            // =================================================

            function validateConfig() {

                if (!config) {

                    throw new Error(
                        "portal-config.js did not load."
                    );

                }


                if (
                    !config.clerkPublishableKey ||
                    !config.supabaseUrl ||
                    !config.supabasePublishableKey
                ) {

                    throw new Error(
                        "Altimin public configuration is incomplete."
                    );

                }

            }


            // =================================================
            // CLERK DOMAIN
            // =================================================

            function getClerkDomain(
                publishableKey
            ) {

                const encoded =
                    publishableKey.replace(
                        /^pk_(test|live)_/,
                        ""
                    );


                const base64 =
                    encoded
                        .replace(
                            /-/g,
                            "+"
                        )
                        .replace(
                            /_/g,
                            "/"
                        );


                const padded =
                    base64.padEnd(
                        Math.ceil(
                            base64.length / 4
                        ) * 4,
                        "="
                    );


                const decoded =
                    atob(
                        padded
                    );


                return decoded.replace(
                    /\$$/,
                    ""
                );

            }


            // =================================================
            // SCRIPT LOADER
            // =================================================

            function loadScript(
                source,
                attributes = {}
            ) {

                return new Promise(
                    (
                        resolve,
                        reject
                    ) => {

                        const existing =
                            document.querySelector(
                                `script[src="${source}"]`
                            );


                        if (existing) {

                            if (
                                existing.dataset.loaded ===
                                "true"
                            ) {

                                resolve();

                                return;

                            }


                            existing.addEventListener(
                                "load",
                                resolve,
                                {
                                    once: true
                                }
                            );

                            existing.addEventListener(
                                "error",
                                reject,
                                {
                                    once: true
                                }
                            );

                            return;

                        }


                        const script =
                            document.createElement(
                                "script"
                            );


                        script.src =
                            source;

                        script.async =
                            true;


                        Object.entries(
                            attributes
                        ).forEach(
                            (
                                [
                                    key,
                                    value
                                ]
                            ) => {

                                script.setAttribute(
                                    key,
                                    value
                                );

                            }
                        );


                        script.addEventListener(
                            "load",
                            () => {

                                script.dataset.loaded =
                                    "true";

                                resolve();

                            }
                        );


                        script.addEventListener(
                            "error",
                            () => {

                                reject(
                                    new Error(
                                        `Could not load ${source}`
                                    )
                                );

                            }
                        );


                        document.head.appendChild(
                            script
                        );

                    }
                );

            }


            // =================================================
            // LOAD CLERK
            // =================================================

            async function loadClerk() {

                const clerkDomain =
                    getClerkDomain(
                        config.clerkPublishableKey
                    );


                await loadScript(
                    `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js`,
                    {
                        crossorigin:
                            "anonymous"
                    }
                );


                await loadScript(
                    `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`,
                    {
                        crossorigin:
                            "anonymous",

                        "data-clerk-publishable-key":
                            config.clerkPublishableKey
                    }
                );


                if (!window.Clerk) {

                    throw new Error(
                        "ClerkJS loaded but the Clerk object is unavailable."
                    );

                }


                await window.Clerk.load({

                    ui: {

                        ClerkUI:
                            window
                                .__internal_ClerkUICtor

                    }

                });

            }


            // =================================================
            // SUPABASE CLIENT
            // =================================================

            function createDatabaseClient() {

                if (
                    !window.supabase ||
                    !window.supabase.createClient
                ) {

                    throw new Error(
                        "Supabase JavaScript client did not load."
                    );

                }


                databaseClient =
                    window.supabase.createClient(

                        config.supabaseUrl,

                        config.supabasePublishableKey,

                        {

                            accessToken:
                                async () => {

                                    if (
                                        !window.Clerk ||
                                        !window.Clerk.session
                                    ) {

                                        return null;

                                    }


                                    return (
                                        await window
                                            .Clerk
                                            .session
                                            .getToken()
                                    );

                                }

                        }

                    );

            }


            // =================================================
            // DATABASE TEST
            // =================================================

            async function runDatabaseTest() {

                if (testRunning) {

                    return;

                }


                if (
                    !window.Clerk ||
                    !window.Clerk.session ||
                    !window.Clerk.user
                ) {

                    setStatus(
                        "Sign in with the Clerk admin account first.",
                        "testing"
                    );

                    return;

                }


                testRunning =
                    true;


                retryButton.hidden =
                    true;


                setStatus(
                    "Authenticated with Clerk. Testing Supabase and RLS...",
                    "testing"
                );


                try {

                    if (!databaseClient) {

                        createDatabaseClient();

                    }


                    // =============================================
                    // CURRENT PORTAL MEMBERSHIP
                    // =============================================

                    const {
                        data:
                            membership,

                        error:
                            membershipError

                    } =
                        await databaseClient
                            .from(
                                "portal_members"
                            )
                            .select(
                                "id, clerk_user_id, role, client_id, active"
                            )
                            .eq(
                                "clerk_user_id",
                                window
                                    .Clerk
                                    .user
                                    .id
                            )
                            .maybeSingle();


                    if (membershipError) {

                        throw membershipError;

                    }


                    if (!membership) {

                        throw new Error(
                            "Clerk authentication succeeded, but no matching Altimin portal membership was found."
                        );

                    }


                    // =============================================
                    // ADMIN CLIENT VISIBILITY TEST
                    // =============================================

                    const {
                        data:
                            clients,

                        error:
                            clientsError

                    } =
                        await databaseClient
                            .from(
                                "portal_clients"
                            )
                            .select(
                                "id, company, status"
                            )
                            .order(
                                "id",
                                {
                                    ascending:
                                        true
                                }
                            );


                    if (clientsError) {

                        throw clientsError;

                    }


                    setOutput({

                        result:
                            "PASS",

                        clerk: {

                            signedIn:
                                true,

                            userId:
                                window
                                    .Clerk
                                    .user
                                    .id

                        },

                        altiminMembership:
                            membership,

                        visibleClients:
                            clients,

                        message:
                            "Clerk authentication and Supabase RLS are connected."

                    });


                    setStatus(
                        "PASS — Clerk → Supabase → Altimin RLS is working.",
                        "success"
                    );

                } catch (
                    error
                ) {

                    console.error(
                        "Altimin connection test failed:",
                        error
                    );


                    setOutput({

                        result:
                            "FAIL",

                        name:
                            error?.name ||
                            "Error",

                        message:
                            error?.message ||
                            String(
                                error
                            ),

                        code:
                            error?.code ||
                            null,

                        details:
                            error?.details ||
                            null,

                        hint:
                            error?.hint ||
                            null

                    });


                    setStatus(
                        "Connection test failed. Send me the result shown below.",
                        "error"
                    );


                    retryButton.hidden =
                        false;

                } finally {

                    testRunning =
                        false;

                }

            }


            // =================================================
            // START
            // =================================================

            async function start() {

                try {

                    validateConfig();


                    setStatus(
                        "Loading Clerk...",
                        "testing"
                    );


                    await loadClerk();


                    setOutput(
                        "Clerk loaded."
                    );


                    // =============================================
                    // USER ALREADY SIGNED IN
                    // =============================================

                    if (
                        window.Clerk.session &&
                        window.Clerk.user
                    ) {

                        await runDatabaseTest();

                        return;

                    }


                    // =============================================
                    // WAIT FOR SIGN IN
                    // =============================================

                    setStatus(
                        "Clerk loaded. Sign in with the Altimin admin account.",
                        "testing"
                    );


                    setOutput(
                        "Waiting for admin authentication..."
                    );


                    window.Clerk.mountSignIn(
                        signInHost
                    );


                    let connectionStarted =
                        false;


                    window.Clerk.addListener(

                        async (
                            {
                                session,
                                user
                            }
                        ) => {

                            if (
                                !session ||
                                !user ||
                                connectionStarted
                            ) {

                                return;

                            }


                            connectionStarted =
                                true;


                            window.Clerk
                                .unmountSignIn(
                                    signInHost
                                );


                            signInHost.innerHTML =
                                "";


                            await runDatabaseTest();

                        },

                        {
                            skipInitialEmit:
                                true
                        }

                    );

                } catch (
                    error
                ) {

                    console.error(
                        error
                    );


                    setStatus(
                        "The connection test could not start.",
                        "error"
                    );


                    setOutput({

                        result:
                            "FAIL",

                        message:
                            error?.message ||
                            String(
                                error
                            )

                    });

                }

            }


            retryButton.addEventListener(
                "click",
                runDatabaseTest
            );


            start();

        })();

    </script>

</body>

</html>
