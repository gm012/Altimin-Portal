<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Altimin Portal Connection Test
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0d10;
            color: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(900px, calc(100% - 40px));
            margin: 0 auto;
            padding: 60px 0;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #aeb6c0;
            line-height: 1.6;
        }

        .panel {
            margin-top: 28px;
            padding: 24px;
            border: 1px solid #303640;
            border-radius: 14px;
            background: #14171c;
        }

        #status {
            font-weight: 700;
        }

        #status.success {
            color: #73dc96;
        }

        #status.error {
            color: #ff8181;
        }

        #signIn {
            margin-top: 30px;
        }

        pre {
            margin-top: 28px;
            padding: 20px;
            background: #0d1014;
            border: 1px solid #303640;
            border-radius: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            color: #b8f5c7;
            min-height: 100px;
        }
    </style>
</head>


<body>

    <main>

        <h1>
            Altimin Connection Test
        </h1>

        <p>
            Testing Clerk authentication and Supabase access.
        </p>

        <div class="panel">

            <div id="status">
                Loading Clerk...
            </div>

            <div id="signIn"></div>

        </div>

        <pre id="output">
Waiting...
        </pre>

    </main>


    <!-- =============================================
         ALTIMIN CONFIG
    ============================================== -->

    <script src="portal-config.js"></script>


    <!-- =============================================
         CLERK UI
    ============================================== -->

    <script
        defer
        crossorigin="anonymous"
        src="https://inviting-molly-2739.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
        type="text/javascript"
    ></script>


    <!-- =============================================
         CLERK JS
    ============================================== -->

    <script
        defer
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_aW52aXRpbmctbW9sbHktMjczOS5jbGVyay5hY2NvdW50cy5kZXYk"
        src="https://inviting-molly-2739.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
        type="text/javascript"
    ></script>


    <!-- =============================================
         SUPABASE
    ============================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =============================================
         TEST
    ============================================== -->

    <script>

        window.addEventListener(
            "load",
            async function () {

                const status =
                    document.getElementById(
                        "status"
                    );

                const output =
                    document.getElementById(
                        "output"
                    );

                const signIn =
                    document.getElementById(
                        "signIn"
                    );


                function showOutput(
                    value
                ) {

                    output.textContent =
                        typeof value === "string"
                            ? value
                            : JSON.stringify(
                                value,
                                null,
                                2
                            );

                }


                try {

                    // =============================================
                    // CLERK
                    // =============================================

                    await Clerk.load({

                        ui: {
                            ClerkUI:
                                window.__internal_ClerkUICtor
                        }

                    });


                    console.log(
                        "Clerk loaded"
                    );


                    console.log(
                        "Signed in:",
                        Clerk.isSignedIn
                    );


                    console.log(
                        "Clerk user:",
                        Clerk.user
                    );


                    // =============================================
                    // SUPABASE
                    // =============================================

                    const supabaseClient =
                        window.supabase.createClient(

                            window
                                .AltiminConfig
                                .supabaseUrl,

                            window
                                .AltiminConfig
                                .supabasePublishableKey,

                            {

                                accessToken:
                                    async () => {

                                        if (
                                            !Clerk.session
                                        ) {

                                            return null;

                                        }


                                        return await Clerk
                                            .session
                                            .getToken();

                                    }

                            }

                        );


                    // =============================================
                    // DATABASE CHECK
                    // =============================================

                    async function testDatabase() {

                        if (
                            !Clerk.user ||
                            !Clerk.session
                        ) {

                            return;

                        }


                        status.textContent =
                            "Clerk signed in. Testing Supabase...";


                        const userId =
                            Clerk.user.id;


                        console.log(
                            "Testing Supabase with:",
                            userId
                        );


                        const {
                            data,
                            error
                        } =
                            await supabaseClient
                                .from(
                                    "portal_members"
                                )
                                .select(
                                    "id, clerk_user_id, role, client_id, active"
                                )
                                .eq(
                                    "clerk_user_id",
                                    userId
                                )
                                .maybeSingle();


                        if (error) {

                            throw error;

                        }


                        if (!data) {

                            throw new Error(
                                "Clerk login succeeded, but this user was not found in portal_members."
                            );

                        }


                        const {
                            data:
                                clients,

                            error:
                                clientsError

                        } =
                            await supabaseClient
                                .from(
                                    "portal_clients"
                                )
                                .select(
                                    "id, company, contact, email, status"
                                )
                                .order(
                                    "id"
                                );


                        if (clientsError) {

                            throw clientsError;

                        }


                        status.textContent =
                            "PASS — Clerk and Supabase are connected.";

                        status.className =
                            "success";


                        signIn.innerHTML =
                            "";


                        showOutput({

                            result:
                                "PASS",

                            clerkUserId:
                                userId,

                            membership:
                                data,

                            clients:
                                clients

                        });

                    }


                    // =============================================
                    // ALREADY SIGNED IN
                    // =============================================

                    if (
                        Clerk.isSignedIn
                    ) {

                        await testDatabase();

                        return;

                    }


                    // =============================================
                    // SIGN IN SCREEN
                    // =============================================

                    status.textContent =
                        "Clerk loaded. Sign in below.";


                    Clerk.mountSignIn(
                        signIn
                    );


                    Clerk.addListener(

                        async (
                            clerkState
                        ) => {

                            if (
                                clerkState.user &&
                                clerkState.session
                            ) {

                                Clerk.unmountSignIn(
                                    signIn
                                );


                                await testDatabase();

                            }

                        }

                    );


                } catch (
                    error
                ) {

                    console.error(
                        error
                    );


                    status.textContent =
                        "FAIL — connection test error.";

                    status.className =
                        "error";


                    showOutput({

                        result:
                            "FAIL",

                        message:
                            error?.message ||
                            String(
                                error
                            ),

                        code:
                            error?.code ||
                            null,

                        details:
                            error?.details ||
                            null,

                        hint:
                            error?.hint ||
                            null

                    });

                }

            }
        );

    </script>

</body>

</html>
